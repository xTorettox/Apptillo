name: Build Android APK (El Altillo 8-Bits)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: 6. Install Node Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: 7. Bundle Offline React Native Assets
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: 8. Build Android APKs (Debug & Release)
        working-directory: android
        run: |
          chmod +x gradlew || true
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: 9. Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: El-Altillo-8Bits-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 10. Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: El-Altillo-8Bits-Release-APK
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
          if-no-files-found: ignore
