name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Forzar Gradle 8.0.1 Global
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.0.1'

      - name: Sincronizar versiones React Native
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.dependencies['react-native'] = '0.72.10';
            pkg.dependencies['react'] = '18.2.0';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          yarn install --ignore-engines

      - name: Parche maestro para Android Plugin
        run: |
          sed -i -E 's/com\.android\.tools\.build:gradle:[0-9\.]+/com.android.tools.build:gradle:8.0.2/g' android/build.gradle || true
          sed -i -E "s/id\s*\(\s*['\"]com.android.application['\"]\s*\)\s*version\s*['\"][0-9\.]+['\"]/id('com.android.application') version '8.0.2'/g" android/build.gradle || true
          sed -i -E "s/id\s*['\"]com.android.application['\"]\s*version\s*['\"][0-9\.]+['\"]/id 'com.android.application' version '8.0.2'/g" android/build.gradle || true
          sed -i -E 's/kotlinVersion\s*=\s*["'"'"'][0-9\.]+["'"'"']/kotlinVersion = "1.8.20"/g' android/build.gradle || true
          echo "android.defaults.buildfeatures.buildconfig=true" >> android/gradle.properties

      - name: Compilar el APK
        run: cd android && gradle assembleDebug

      - name: Guardar el APK generado
        uses: actions/upload-artifact@v4
        with:
          name: altillo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
