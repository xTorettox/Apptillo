name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar dependencias exactas
        run: |
          npm install --legacy-peer-deps
          npm install @react-native-community/cli-platform-android@11.3.10 --no-save

      - name: Compilar el APK
        run: cd android && gradle assembleDebug

      - name: Guardar el APK generado
        uses: actions/upload-artifact@v4
        with:
          name: altillo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
