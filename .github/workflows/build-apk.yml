name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar dependencias con Yarn
        run: yarn install

      - name: Parchear rutas viejas de AG
        run: |
          sed -i 's/@react-native-community\/cli-platform-android/@react-native\/gradle-plugin/g' android/settings.gradle
          sed -i 's/@react-native-community\/cli-platform-android/@react-native\/gradle-plugin/g' android/app/build.gradle

      - name: Generar archivos Gradle
        run: cd android && gradle wrapper

      - name: Dar permisos
        run: chmod +x android/gradlew

      - name: Compilar el APK
        run: cd android && ./gradlew assembleDebug

      - name: Guardar el APK generado
        uses: actions/upload-artifact@v4
        with:
          name: altillo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
